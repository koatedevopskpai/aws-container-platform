# =============================================================================
# EKS Deploy Workflow - OIDC-authenticated Terraform deployment
# =============================================================================
# ARCHITECTURE DECISION: OIDC auth over static AWS credentials
# GitHub Actions assumes an IAM role via OIDC. No AWS access keys
# are stored as GitHub Secrets. This eliminates credential leakage
# through: (1) secret exfiltration, (2) branch protections bypass,
# (3) third-party action compromises.
#
# SECURITY SAFEGUARD: Environment-based approval gates
# The prod environment requires manual approval. Dev/staging deploy
# automatically on main branch pushes. This enforces change management
# for production infrastructure.
#
# NOTE: the Terraform root module is the repository root. Earlier revisions
# set `working-directory: aws/container-platform`, a path that does not exist,
# so every Terraform step died before running. Corrected below.
#
# NOTE: plan and apply require AWS credentials to assume the deploy role via
# OIDC. This is a public reference repo with no OIDC role configured, so those
# jobs are gated on `AWS_ROLE_ARN` being present and skip cleanly when it is
# absent. The format check always runs.
# =============================================================================

name: EKS Deploy

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'modules/**'
      - '.github/workflows/eks-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'modules/**'

permissions:
  id-token: write   # Required for OIDC auth
  contents: read    # Required to checkout repo
  pull-requests: write # Required for plan comments

env:
  TF_VERSION: 1.6.6
  AWS_REGION: eu-west-2

jobs:
  # Reports whether the deploy role is configured. Jobs that need AWS read this
  # rather than failing on an empty credential.
  credentials-check:
    name: Check AWS credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_ROLE_ARN is not set - skipping terraform plan and apply."
          fi

  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  terraform-plan:
    name: Terraform Plan
    needs: [terraform-fmt, credentials-check]
    if: needs.credentials-check.outputs.available == 'true'
    runs-on: ubuntu-latest
    # ARCHITECTURE DECISION: OIDC role per environment
    # Each environment has its own IAM role with scoped permissions.
    # The role ARN is mapped by the GitHub environment.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-deploy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -var-file=terraform.tfvars -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: tfplan

  terraform-apply:
    name: Terraform Apply
    needs: [terraform-plan, credentials-check]
    if: needs.credentials-check.outputs.available == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: .

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # SECURITY SAFEGUARD: Post-deploy validation
      - name: Validate EKS Cluster
        run: |
          aws eks describe-cluster --name $(terraform output -raw cluster_name) --region ${{ env.AWS_REGION }}
