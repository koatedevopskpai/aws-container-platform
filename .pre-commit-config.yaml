# =============================================================================
# Pre-commit Hooks Configuration
# =============================================================================
# ARCHITECTURE DECISION: Pre-commit for local quality gates
# Running these checks before commit catches formatting and security
# issues before they reach CI/CD, reducing pipeline feedback loops.
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # General hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
        # SECURITY SAFEGUARD: Prevents committing private keys
      - id: check-symlinks
      - id: destroyed-symlinks

  # ---------------------------------------------------------------------------
  # Terraform hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.0
    hooks:
      - id: terraform_fmt
        # ARCHITECTURE DECISION: Enforce canonical formatting
        # terraform fmt ensures consistent code style across all engineers.
        args:
          - --args=-recursive

      - id: terraform_tflint
        # ARCHITECTURE DECISION: Lint before plan
        # Catches invalid syntax, deprecated constructs, and AWS best
        # practice violations before Terraform init.
        args:
          - --args=--config=.tflint.hcl
          - --args=--call-module-mode=all

      - id: terraform_trivy
        # SECURITY SAFEGUARD: Vulnerability scanning for IaC
        # Trivy catches known-vulnerable Terraform provider versions
        # and insecure resource configurations.
        args:
          - --args=--severity=CRITICAL,HIGH

      - id: terraform_validate
        # Validates syntax and internal references
        args:
          - --args=-no-color
          - --init-args=-input=false
        exclude: '^modules/'

      - id: terraform_docs
        # Automatically generates/updates module documentation
        args:
          - --args=--config=.terraform-docs.yml
          - --hook-config=--path-to-file=README.md

      - id: infracost_breakdown
        # Cost estimation on every commit
        args:
          - --args=--path=.

  # ---------------------------------------------------------------------------
  # YAML and Markdown hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [--format, parsable, --strict]

  # ---------------------------------------------------------------------------
  # Shell script hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        # SECURITY SAFEGUARD: Validates shell scripts don't contain
        # common injection or logic errors.

  # ---------------------------------------------------------------------------
  # Git commit message hook
  # ---------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        # ARCHITECTURE DECISION: Conventional commits
        # Enforces structured commit messages for changelog generation
        # and semantic versioning.
        stages: [commit-msg]
